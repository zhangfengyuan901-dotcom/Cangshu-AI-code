name: piknoai-relay

services:
  new-api:
    image: pikno-new-api:v1.0.0-rc.41-brand.7
    build:
      context: .
      dockerfile: Dockerfile.brand
      args:
        NEW_API_SOURCE_SHA256: "5925b8f65dc89874ec3b7b2075c0be1b70de4033bae33834b85d2500f60689aa"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      SQL_DSN: "postgresql://pikno:${POSTGRES_PASSWORD:?Run init-secrets.cjs first}@postgres:5432/newapi?sslmode=disable"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Run init-secrets.cjs first}@redis:6379"
      SESSION_SECRET: "${SESSION_SECRET:?Run init-secrets.cjs first}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?Run init-secrets.cjs first}"
      TZ: Asia/Shanghai
      NODE_NAME: piknoai-local-1
      PIKNO_FIXED_CNY_TOPUP: "true"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_COOKIE_TRUSTED_URL: "${SESSION_COOKIE_TRUSTED_URL:-}"
    volumes:
      - newapi_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    environment:
      POSTGRES_USER: pikno
      POSTGRES_DB: newapi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run init-secrets.cjs first}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikno -d newapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run init-secrets.cjs first}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  newapi_data:
  postgres_data:
  redis_data:

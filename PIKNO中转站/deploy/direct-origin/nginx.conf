user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Request errors can contain signed URLs. Access records below contain no URL,
# query, credentials, cookies or client identifiers.
error_log /dev/stderr emerg;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $uri $route_class {
        default app;
        ~^/api/ auth_api;
        ~^/v1/ model_api;
        ~^/media/v1/assets/ media;
        ~^/media/v1/tools control;
        /media/v1/packy control;
        ~^/pay/lanjing/ payment;
        ~^/\.well-known/acme-challenge/ acme;
    }
    log_format bounded '$time_iso8601 $request_method $route_class $status '
                       '$request_time $upstream_response_time $body_bytes_sent';
    access_log /dev/stdout bounded;

    limit_conn_zone $server_name zone=asset_uploads:64k;

    client_max_body_size 55m;
    client_header_timeout 15s;
    client_body_timeout 180s;
    send_timeout 180s;
    keepalive_timeout 65s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream account_api {
        zone account_api 64k;
        server new-api:3000 resolve;
        keepalive 32;
    }
    upstream payment_bridge {
        zone payment_bridge 64k;
        server lanjing-bridge:8080 resolve;
        keepalive 8;
    }
    upstream task_control {
        zone task_control 64k;
        server tool-control:8090 resolve;
        keepalive 16;
    }
    upstream media_storage {
        zone media_storage 64k;
        server media.piknoai.com:443 resolve;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.piknoai.com;
    proxy_set_header X-Forwarded-Host www.piknoai.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    # Preserve Origin and Referer for the application's CSRF validation.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # A failed submit must never be retried at another upstream by the proxy.
    proxy_next_upstream off;
    proxy_redirect off;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name www.piknoai.com origin.piknoai.com;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name www.piknoai.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        location = /v1/images/edits {
            client_max_body_size 601m;
            proxy_pass http://account_api;
        }
        location = /media/v1/tools { proxy_pass http://task_control; }
        location ^~ /media/v1/tools/ { proxy_pass http://task_control; }
        location = /media/v1/packy { proxy_pass http://task_control; }
        location ^~ /media/v1/assets/ {
            # The customer URL remains on www; only the internal destination
            # changes. No trailing slash: keep /media and the signed query.
            error_page 418 = @asset_upload;
            if ($request_method = PUT) { return 418; }
            proxy_pass http://task_control;
            proxy_set_header Connection "";
            proxy_set_header Host www.piknoai.com;
            proxy_set_header X-Forwarded-Host www.piknoai.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Protocol "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
        }
        location @asset_upload {
            # Forward only complete uploads. Keep the body in memory within the
            # existing 55 MiB cap and bound concurrent allocations.
            client_body_buffer_size 55m;
            client_body_timeout 30s;
            limit_conn asset_uploads 4;
            proxy_request_buffering on;
            proxy_pass http://task_control;
            # Defining any header here stops parent inheritance; repeat the
            # reviewed set rather than accidentally trusting client headers.
            proxy_set_header Connection "";
            proxy_set_header Host www.piknoai.com;
            proxy_set_header X-Forwarded-Host www.piknoai.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Protocol "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
        }
        location ^~ /media/ { return 404; }
        # Serve the account update through the existing read-only public webroot.
        location ~ ^/account-lite/(index[.]html|account[.]mjs|account[.]css|admin-wechat[.]png)$ {
            alias /var/www/acme/hamster-account-manual-20261118/$1;
            types {
                text/html html;
                application/javascript mjs;
                text/css css;
                image/png png;
            }
            charset utf-8;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # Customer checkout is retired. Historical notifications and lookups still route.
        location ~ ^/(?:api/user/(?:pay|topup/checkout)|pay/lanjing/epay/(?:submit[.]php|authorize))/?$ {
            default_type application/json;
            charset utf-8;
            add_header Cache-Control "no-store" always;
            return 410 '{"success":false,"message":"在线充值已关闭，请联系管理员充值。"}';
        }
        location /pay/lanjing/ { proxy_pass http://payment_bridge; }
        location / { proxy_pass http://account_api; }
    }
    # Cloudflare control and storage requests use this origin. Each upstream
    # checks its own service credentials.
    server {
        listen 443 ssl;
        http2 on;
        server_name origin.piknoai.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        location = /media/v1/tools { proxy_pass http://task_control; }
        location ^~ /media/v1/tools/ { proxy_pass http://task_control; }
        location = /media/v1/packy { proxy_pass http://task_control; }
        location ^~ /media/v1/storage-tos/ {
            client_max_body_size 1024m;
            proxy_pass http://task_control;
        }
        location / { return 404; }
    }
}

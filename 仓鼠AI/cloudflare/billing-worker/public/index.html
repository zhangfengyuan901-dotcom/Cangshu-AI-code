<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仓鼠AI · 管理后台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head><body>
<aside><a class="brand" href="/">仓鼠AI <small>CONTROL ROOM</small></a><nav id="nav"></nav><p class="aside-note">鹿鸣一方传媒<br>客户 · 计费 · 渠道</p><button id="logout">退出管理</button></aside>
<main><header><div><span class="eyebrow">仓鼠AI PLATFORM</span><h1 id="title">经营概览</h1></div><button id="refresh">刷新数据</button></header>
<section id="login" class="panel"><span class="eyebrow">安全管理入口</span><h2>邮箱验证码登录</h2><p>仅指定管理员邮箱可以登录，无需填写密钥。</p><form id="login-form"><label>管理员邮箱<input id="admin-email" type="email" autocomplete="username" placeholder="请输入管理员邮箱" maxlength="254" required></label><label>动态验证码<span class="code-row"><input id="admin-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="六位验证码" required><button type="button" id="send-code">获取验证码</button></span></label><p id="login-status" role="status">验证码 10 分钟内有效，仅可使用一次。</p><button class="primary" id="login-submit" disabled>验证并进入后台</button></form><p class="login-note">登录有效期为 4 小时。请勿向任何人提供验证码；公共电脑使用后请退出管理。</p></section>
<p id="notice" role="status"></p><section id="content" hidden></section></main>
<dialog id="editor"><form id="edit-form"><h2 id="edit-title"></h2><div id="fields"></div><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="submit">确认</button></div></form></dialog>
</body></html>
